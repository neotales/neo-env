[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Neotales"]
repository = "https://github.com/neotales/neo-env"
version = "0.1.0"
publish = false

[workspace.dependencies]
# The neo-env crates.
neoenv-config = { path = "crates/neoenv-config", version = "0.1.0" }
neoenv-core = { path = "crates/neoenv-core", version = "0.1.0" }
neoenv-installer = { path = "crates/neoenv-installer", version = "0.1.0" }
neoenv-policy = { path = "crates/neoenv-policy", version = "0.1.0" }
neoenv-runtime = { path = "crates/neoenv-runtime", version = "0.1.0" }

# The vendored neotales crates. They live in this repository so the build needs
# no second checkout.
neotales-dotenv = { path = "crates/neotales-dotenv", version = "0.0.0-alpha.1" }
neotales-env = { path = "crates/neotales-env", version = "0.0.0-alpha.1" }
neotales-gotmpl = { path = "crates/neotales-gotmpl", version = "0.0.0-alpha.1" }
neotales-process = { path = "crates/neotales-process", version = "0.0.0-alpha.1" }
neotales-age = { path = "crates/neotales-age", version = "0.0.0-alpha.1" }
neotales-keepass = { path = "crates/neotales-keepass", version = "0.0.0-alpha.3" }

aes = "0.9.2"
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.22"
blake3 = "1"
blowfish = { version = "0.10.0", features = ["bcrypt"] }
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chacha20 = { version = "0.10.2", features = ["cipher", "legacy", "xchacha"] }
chacha20poly1305 = { version = "0.11", features = ["reduced-round"] }
ctr = "0.10.1"
ctrlc = "3.5"
des = { version = "0.9.0", features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
flate2 = "1.1"
fs4 = "1.1"
getrandom = "0.3"
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["sys_rng"] }
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.14.1", features = ["nistp"] }
indexmap = { version = "2.12", features = ["serde"] }
md-5 = "0.11.0"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
p256 = "0.14.0"
p384 = "0.14.0"
p521 = "0.14.0"
poly1305 = "0.9.1"
quick-xml = "0.42"
rcgen = { version = "0.14.7", features = ["zeroize", "x509-parser"] }
regex = "1.13"
rsa = "0.9.10"
sad-rsa = { version = "0.10.2", features = ["std"] }
salsa20 = "0.11"
scrypt = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# The vendored keepass and ssh crates use the 0.11 line. `neoenv-runtime` keeps
# its 0.10 dependency inline in its own manifest.
sha1 = "0.11.0"
sha2 = "0.10"
subtle = "2.6.1"
tar = "0.4"
tempfile = "3.24"
testcontainers = "=0.28.0"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1.47", default-features = false }
toml = { version = "0.9", features = ["preserve_order"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
xz2 = "0.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# 1.9.1 redacts `Zeroizing`'s Debug output. neotales-keepass was tested against
# 1.9.0, and its hand-written Debug impl exists because that version prints the
# wrapped secret. Do not float this until that impl is revisited.
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
