[package]
name = "neoenv-windows-job"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "neoenv-windows-launcher"
path = "src/bin/neoenv-windows-launcher.rs"
test = false
bench = false

[target.'cfg(windows)'.dependencies]
serde.workspace = true
serde_json.workspace = true
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
